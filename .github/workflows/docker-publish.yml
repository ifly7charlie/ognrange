# Build the next, aprs and apache images from conf/Dockerfile and publish them
# to GHCR. Pull requests build only (nothing is pushed).
#
# Images contain no site config - NEXT_PUBLIC_* and aprs settings come from the
# container environment at runtime, so no secrets are used here other than
# the job's own GITHUB_TOKEN.
#
# Third party actions are pinned to commit SHAs; dependabot keeps them current.
name: docker-publish

on:
    push:
        branches: [main]
        tags: ['v*']
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions: {}

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    build:
        name: build ${{ matrix.target }}
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        permissions:
            contents: read
            packages: write
            id-token: write
            attestations: write
        strategy:
            fail-fast: false
            matrix:
                target: [next, aprs, apache]
        env:
            IMAGE: ghcr.io/${{ github.repository_owner }}/ogr-${{ matrix.target }}
            PUSH: ${{ github.event_name != 'pull_request' }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Log in to GHCR
              if: env.PUSH == 'true'
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Image metadata
              id: meta
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
              with:
                  images: ${{ env.IMAGE }}
                  tags: |
                      type=sha,prefix=sha-
                      type=ref,event=branch
                      type=ref,event=pr
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=raw,value=latest,enable={{is_default_branch}}

            - name: Build and push
              id: build
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  file: conf/Dockerfile
                  target: ${{ matrix.target }}
                  platforms: linux/amd64
                  build-args: GIT_REF=${{ github.sha }}
                  push: ${{ env.PUSH == 'true' }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  provenance: mode=max
                  sbom: true
                  # PR builds may read the cache but never write it
                  cache-from: type=gha,scope=${{ matrix.target }}
                  cache-to: ${{ env.PUSH == 'true' && format('type=gha,mode=max,scope={0}', matrix.target) || '' }}

            - name: Attest build provenance
              if: env.PUSH == 'true'
              uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
              with:
                  subject-name: ${{ env.IMAGE }}
                  subject-digest: ${{ steps.build.outputs.digest }}
                  push-to-registry: true
